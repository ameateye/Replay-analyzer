<?xml version="1.0" encoding="UTF-8"?>
<!-- Tileable Factorio-style "concrete plate" background. 256x256 tile with
     two staggered plates per side, subtle noise, faint rivets at corners.
     Dark warm-gray base so cream/orange UI text and accents pop on top. -->
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch" seed="3"/>
      <feColorMatrix values="0 0 0 0 0.10
                              0 0 0 0 0.09
                              0 0 0 0 0.07
                              0 0 0 0.55 0"/>
    </filter>
    <linearGradient id="plate" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#26241f"/>
      <stop offset="50%"  stop-color="#1c1a17"/>
      <stop offset="100%" stop-color="#171411"/>
    </linearGradient>
  </defs>

  <!-- Base color -->
  <rect width="256" height="256" fill="#1a1816"/>

  <!-- Plate grid: 4 staggered 128x128 plates per tile so seams form a
       brick-like offset pattern. Each plate has a slight gradient + bevel. -->
  <g>
    <!-- Top row plates -->
    <rect x="0"   y="0"   width="128" height="128" fill="url(#plate)"/>
    <rect x="128" y="0"   width="128" height="128" fill="url(#plate)" opacity="0.92"/>
    <!-- Bottom row plates, offset by 64px to break the seam vertical -->
    <rect x="-64" y="128" width="128" height="128" fill="url(#plate)" opacity="0.95"/>
    <rect x="64"  y="128" width="128" height="128" fill="url(#plate)" opacity="0.9"/>
    <rect x="192" y="128" width="128" height="128" fill="url(#plate)" opacity="0.93"/>
  </g>

  <!-- Plate seams: dark grooves on bottom/right of each plate, light bevel
       on top/left for the embossed concrete feel. -->
  <g stroke-linecap="square" shape-rendering="crispEdges">
    <!-- Top-row plate seams -->
    <line x1="0"   y1="127.5" x2="256" y2="127.5" stroke="#0a0908" stroke-width="1"/>
    <line x1="0"   y1="128.5" x2="256" y2="128.5" stroke="#383530" stroke-width="1" opacity="0.45"/>
    <line x1="127.5" y1="0"   x2="127.5" y2="128" stroke="#0a0908" stroke-width="1"/>
    <line x1="128.5" y1="0"   x2="128.5" y2="128" stroke="#383530" stroke-width="1" opacity="0.4"/>
    <!-- Bottom-row offset seams -->
    <line x1="63.5"  y1="128" x2="63.5"  y2="256" stroke="#0a0908" stroke-width="1"/>
    <line x1="64.5"  y1="128" x2="64.5"  y2="256" stroke="#383530" stroke-width="1" opacity="0.4"/>
    <line x1="191.5" y1="128" x2="191.5" y2="256" stroke="#0a0908" stroke-width="1"/>
    <line x1="192.5" y1="128" x2="192.5" y2="256" stroke="#383530" stroke-width="1" opacity="0.4"/>
  </g>

  <!-- Rivets — small bevelled dots at plate corners. -->
  <g>
    <!-- Top-row plate corners (skip outer edge to keep tile seamless). -->
    <g transform="translate(8,8)">
      <circle r="2.2" fill="#0a0908"/>
      <circle r="1.6" fill="#3a3733"/>
      <circle cx="-0.4" cy="-0.4" r="0.6" fill="#5a5752"/>
    </g>
    <g transform="translate(120,8)">
      <circle r="2.2" fill="#0a0908"/>
      <circle r="1.6" fill="#3a3733"/>
      <circle cx="-0.4" cy="-0.4" r="0.6" fill="#5a5752"/>
    </g>
    <g transform="translate(136,8)">
      <circle r="2.2" fill="#0a0908"/>
      <circle r="1.6" fill="#3a3733"/>
      <circle cx="-0.4" cy="-0.4" r="0.6" fill="#5a5752"/>
    </g>
    <g transform="translate(248,8)">
      <circle r="2.2" fill="#0a0908"/>
      <circle r="1.6" fill="#3a3733"/>
      <circle cx="-0.4" cy="-0.4" r="0.6" fill="#5a5752"/>
    </g>
    <!-- Bottom-row plate corners -->
    <g transform="translate(8,120)">
      <circle r="2.2" fill="#0a0908"/>
      <circle r="1.6" fill="#3a3733"/>
      <circle cx="-0.4" cy="-0.4" r="0.6" fill="#5a5752"/>
    </g>
    <g transform="translate(120,120)">
      <circle r="2.2" fill="#0a0908"/>
      <circle r="1.6" fill="#3a3733"/>
      <circle cx="-0.4" cy="-0.4" r="0.6" fill="#5a5752"/>
    </g>
    <g transform="translate(136,120)">
      <circle r="2.2" fill="#0a0908"/>
      <circle r="1.6" fill="#3a3733"/>
      <circle cx="-0.4" cy="-0.4" r="0.6" fill="#5a5752"/>
    </g>
    <g transform="translate(248,120)">
      <circle r="2.2" fill="#0a0908"/>
      <circle r="1.6" fill="#3a3733"/>
      <circle cx="-0.4" cy="-0.4" r="0.6" fill="#5a5752"/>
    </g>
    <!-- Mid-row offset corners -->
    <g transform="translate(56,136)">
      <circle r="2.2" fill="#0a0908"/>
      <circle r="1.6" fill="#3a3733"/>
      <circle cx="-0.4" cy="-0.4" r="0.6" fill="#5a5752"/>
    </g>
    <g transform="translate(72,136)">
      <circle r="2.2" fill="#0a0908"/>
      <circle r="1.6" fill="#3a3733"/>
      <circle cx="-0.4" cy="-0.4" r="0.6" fill="#5a5752"/>
    </g>
    <g transform="translate(184,136)">
      <circle r="2.2" fill="#0a0908"/>
      <circle r="1.6" fill="#3a3733"/>
      <circle cx="-0.4" cy="-0.4" r="0.6" fill="#5a5752"/>
    </g>
    <g transform="translate(200,136)">
      <circle r="2.2" fill="#0a0908"/>
      <circle r="1.6" fill="#3a3733"/>
      <circle cx="-0.4" cy="-0.4" r="0.6" fill="#5a5752"/>
    </g>
    <g transform="translate(56,248)">
      <circle r="2.2" fill="#0a0908"/>
      <circle r="1.6" fill="#3a3733"/>
      <circle cx="-0.4" cy="-0.4" r="0.6" fill="#5a5752"/>
    </g>
    <g transform="translate(72,248)">
      <circle r="2.2" fill="#0a0908"/>
      <circle r="1.6" fill="#3a3733"/>
      <circle cx="-0.4" cy="-0.4" r="0.6" fill="#5a5752"/>
    </g>
    <g transform="translate(184,248)">
      <circle r="2.2" fill="#0a0908"/>
      <circle r="1.6" fill="#3a3733"/>
      <circle cx="-0.4" cy="-0.4" r="0.6" fill="#5a5752"/>
    </g>
    <g transform="translate(200,248)">
      <circle r="2.2" fill="#0a0908"/>
      <circle r="1.6" fill="#3a3733"/>
      <circle cx="-0.4" cy="-0.4" r="0.6" fill="#5a5752"/>
    </g>
  </g>

  <!-- Grain layer over everything -->
  <rect width="256" height="256" filter="url(#grain)" opacity="0.7"/>
</svg>
